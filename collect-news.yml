name: Collect Iraq trade news

on:
  schedule:
    # 매일 UTC 03:00 (한국시간 정오 / 바그다드 오전 6시)
    - cron: '0 3 * * *'
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect news
        run: python collect_news.py

      - name: Commit if changed
        run: |
          git config user.name  "iris-bot"
          git config user.email "iris-bot@users.noreply.github.com"
          git add news.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "news: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
